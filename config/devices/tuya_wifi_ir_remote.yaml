#
# Tuya WiFi IR Remote Control (IH-07HW-WIFI)
#

packages:
  <<: !include_dir_named ../common

wifi:
  min_auth_mode: !remove # in common and only available on esp32/esp8266

bk72xx:
  board: cbu # https://docs.libretiny.eu/boards/cbu

light:
  - platform: status_led      # Used as a status LED during errors, and status_light when OK. https://esphome.io/components/light/status_led
    pin: P24 # was P8 - moved since P8 is IR receiver on CBU-based boards (was cb3s-assumed)
    id: status_light
    name: Status LED
    icon: mdi:led-on
    disabled_by_default: true # Shows entity in HA, but disabled by default

binary_sensor:                # Button, https://esphome.io/components/binary_sensor/gpio
  - platform: gpio
    pin:
      number: P6
      inverted: true
      mode:
        input: true
        pullup: true          # Holds it high/off, otherwise it flutters on/off
    name: "Button"
    # icon: "mdi:button-pointer"
    # internal: true          # Hides button from HA
    disabled_by_default: true # Shows entity in HA, but disabled by default
    on_press:                 # Switch LED on/off as a test
      - light.turn_on: status_light
    on_release:
      - light.turn_off: status_light

remote_receiver:
  id: ir_rx
  pin:
    number: P8 # was P7 - CBU-based boards (S11 reference) use P7 for TX and P8 for RX
    inverted: true
    mode:
      # INPUT_PULLUP # Seems to do the same as seperate input & pullup
      input: true
      pullup: true
  tolerance: 25%
  dump: all

remote_transmitter:
  id: ir_tx
  pin: P7 # was P26 - CBU-based boards (S11 reference) use P7 for TX and P8 for RX
  # Infrared remotes use a 50% carrier signal
  carrier_duty_percent: 50%

# Infrared platform — creates infrared entities
infrared:
  - platform: ir_rf_proxy
    name: Living room IR Transmitter
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: Living room IR Receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ir_rx
