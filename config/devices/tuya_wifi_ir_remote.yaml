#
# Tuya WiFi IR Remote Control (IH-07HW-WIFI)
#

packages:
  <<: !include_dir_named ../common

wifi:
  min_auth_mode: !remove # in common and only available on esp32/esp8266

bk72xx:
  board: cbu # https://docs.libretiny.eu/boards/cbu
  #board: cb3s # https://docs.libretiny.eu/boards/cb3s/

light:
  - platform: status_led      # Used as a status LED during errors, and status_light when OK. https://esphome.io/components/light/status_led
    pin: P24 # was P8 - moved since P8 is IR receiver on CBU-based boards (was cb3s-assumed)
    id: status_light
    name: Status LED
    icon: mdi:led-on
    disabled_by_default: true # Shows entity in HA, but disabled by default

binary_sensor:                # Button, https://esphome.io/components/binary_sensor/gpio
  - platform: gpio
    pin:
      number: P6
      inverted: true
      mode:
        input: true
        pullup: true          # Holds it high/off, otherwise it flutters on/off
    name: "Button"
    # icon: "mdi:button-pointer"
    # internal: true          # Hides button from HA
    disabled_by_default: true # Shows entity in HA, but disabled by default
    on_press:                 # Switch LED on/off as a test
      - light.turn_on: status_light
    on_release:
      - light.turn_off: status_light

# Home Assistant sensor to store received remote command data
text_sensor:
  - platform: template
    name: Learned Command
    icon: mdi:remote
    id: learned_command

remote_receiver:
  pin:
    number: P8 # was P7 - CBU-based boards (S11 reference) use P7 for TX and P8 for RX
    inverted: true
    mode:
      # INPUT_PULLUP # Seems to do the same as seperate input & pullup
      input: true
      pullup: true
  tolerance: 25%
  dump: all
  # dump: pronto
  # dump: raw
  # dump: samsung
  # on_samsung:
  #     - if:
  # # If Samsung code is received
  #         condition:
  #           lambda: 'return id(remote_learn_switch).state;'
  #         then:
  #           - lambda: |-
  #               id(remote_learn_switch).publish_state(false);
  #               std::string log_output = "Samsung: Data = 0x" + esphome::format_hex((uint32_t)x.data) + ", nbits = " + esphome::to_string(x.nbits);
  #               id(learned_command).publish_state(log_output.c_str());
  #           - delay: 80ms
  #           - light.turn_on: status_light
  #           - delay: 500ms
  #           - light.turn_off: status_light
  # # If Sony code is received
  # on_sony:
  #   - if:
  #       condition:
  #         lambda: 'return id(remote_learn_switch).state;'
  #       then:
  #         - lambda: |-
  #             id(remote_learn_switch).publish_state(false);
  #             std::string log_output = "Sony: Data = 0x" + esphome::format_hex(x.data) + ", nbits = " + esphome::to_string(x.nbits);
  #             id(learned_command).publish_state(log_output.c_str());
  #         - delay: 80ms
  #         - light.turn_on: status_light
  #         - delay: 500ms
  #         - light.turn_off: status_light
  # Pronto decodes any received signal, not just a known protocol - catches everything Samsung/Sony miss
  on_pronto:
    - if:
        condition:
          lambda: 'return id(remote_learn_switch).state;'
        then:
          - lambda: |-
              id(remote_learn_switch).publish_state(false);
              std::string log_output = "Pronto: Data = " + x.data;
              ESP_LOGD("ir_pronto", "%s", log_output.c_str());
              id(learned_command).publish_state(log_output.c_str());
          - delay: 80ms
          - light.turn_on: status_light
          - delay: 500ms
          - light.turn_off: status_light
  # Unconditional raw-timing logger, independent of the Learn Command switch - enable to sanity-check
  # a Pronto capture's underlying timings in the ESPHome log. Raw, like Pronto, decodes every
  # received signal with no protocol match required, so it always fires (not gated on the switch).
  # on_raw:
  #   - lambda: |-
  #       std::string raw_str = "[";
  #       for (size_t i = 0; i < x.size(); i++) {
  #         if (i > 0)
  #           raw_str += ", ";
  #         raw_str += esphome::to_string(x[i]);
  #       }
  #       raw_str += "]";
  #       ESP_LOGD("ir_raw", "Raw: Data = %s", raw_str.c_str());

remote_transmitter:
  pin: P7 # was P26 - CBU-based boards (S11 reference) use P7 for TX and P8 for RX
  # Infrared remotes use a 50% carrier signal
  carrier_duty_percent: 50%

switch:
# Home Assistant controlled switch - to enable "learning mode"
  - platform: template
    name: Learn Command
    id: remote_learn_switch
    icon: mdi:remote
    optimistic: true
